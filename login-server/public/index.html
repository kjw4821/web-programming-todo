<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계정 접속</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <nav aria-label="계정 메뉴" id="menu">
      <button type="button" id="login-tab" aria-pressed="true">로그인</button>
      <button type="button" id="register-tab" aria-pressed="false">회원가입</button>
    </nav>
    <h1 id="title">로그인</h1>
    <form id="auth" method="post">
      <label for="username">아이디</label>
      <input id="username" name="username" pattern="[A-Za-z0-9_]{3,24}" maxlength="24" autocomplete="username" required>
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required>
      <p id="rules" hidden>아이디는 영문·숫자·밑줄 3~24자, 비밀번호는 8~128자로 입력해 주세요.</p>
      <button class="primary" id="submit" type="submit" disabled>로그인</button>
    </form>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
